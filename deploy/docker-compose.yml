# Production stack on the VPS (same host as n8n). The host's nginx is the reverse proxy and handles
# HTTPS with certbot (deploy/nginx/campaign.conf); the app only listens on localhost.
name: campaign

services:
  app:
    build:
      context: ..
      target: runner
    image: campaign:latest
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

  # One-off tasks: docker compose --profile tools run --rm tools npx prisma db push
  tools:
    build:
      context: ..
      target: tools
    image: campaign-tools:latest
    env_file: .env
    profiles: [tools]
