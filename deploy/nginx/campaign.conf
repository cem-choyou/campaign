# /etc/nginx/sites-available/campaign (symlinked in sites-enabled). Same pattern as the n8n site.
# certbot --nginx adds the TLS lines and the HTTP → HTTPS redirect. Security headers (HSTS, CSP…)
# are set by the app itself.
server {
    server_name campaign.choyou-tools.fr;

    # Excel imports go up to 5 MB (§8.8).
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI texts are streamed word by word: no buffering.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    listen 80;
    listen [::]:80;
}
